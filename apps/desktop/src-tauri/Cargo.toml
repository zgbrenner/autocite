[package]
name = "autocite-desktop"
version = "0.7.0"
description = "Private legal citation editor powered by AutoCite"
authors = ["Zachary Brenner"]
edition = "2021"
license = "MIT"
repository = "https://github.com/zgbrenner/autocite"
rust-version = "1.77.2"

[lib]
name = "autocite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AutoCite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
