[package]
name = "autocite-desktop"
version = "0.7.0-dev.0"
description = "Local-first legal citation word processor"
authors = ["Zachary Brenner"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "autocite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
base64 = "0.23.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2.11.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1.48.0", features = ["sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
