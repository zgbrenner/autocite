name: Runner probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create runner proof
        run: |
          printf 'runner=%s\nsha=%s\n' "$RUNNER_NAME" "$GITHUB_SHA" > runner-proof.txt
      - name: Upload runner proof
        uses: actions/upload-artifact@v4
        with:
          name: runner-proof
          path: runner-proof.txt
          if-no-files-found: error
