name: Codex proof-carrying AutoCite autofix

on:
  push:
    branches: [codex/proof-carrying-autofix-v071]
    paths:
      - scripts/codex_proof_carrying_autofix.py
      - .github/workflows/codex-proof-carrying-autofix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-autocite-proof-carrying-autofix
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/proof-carrying-autofix-v071

      - name: Install Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.1'
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Prepare locked Python environments
        run: |
          uv python install 3.10 3.12
          uv sync --frozen --python 3.12 --extra dev --extra tauri-build

      - name: Repair and validate the generated bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/codex_proof_carrying_autofix.py')
          raw = path.read_text(encoding='utf-8')
          prefix = "FILES = json.loads('"
          start = raw.index(prefix) + len(prefix)
          if not raw.endswith("')"):
              raise SystemExit('Unexpected bootstrap payload format')
          payload = raw[start:-2]
          repaired = f'''from __future__ import annotations

          import base64
          import json
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          FILES = json.loads({payload!r})
          TEST_FILES = {{
              "tests/test_edit_safety.py",
              "tests/test_proof_carrying_autofix.py",
          }}
          REQUIRED_FILES = TEST_FILES | {{
              "src/autocite_mcp/edit_safety.py",
              "src/autocite_mcp/engine.py",
              "src/autocite_mcp/tools.py",
              "README.md",
              "docs/EDIT-SAFETY.md",
          }}

          def write_files(paths: set[str]) -> None:
              missing = sorted(paths - FILES.keys())
              if missing:
                  raise SystemExit(f"Missing bootstrap payloads: {{missing}}")
              for relative in sorted(paths):
                  target = ROOT / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(base64.b64decode(FILES[relative], validate=True))
                  print(f"wrote {{relative}}")

          def main() -> None:
              if len(sys.argv) != 2:
                  raise SystemExit("usage: codex_proof_carrying_autofix.py tests|implementation|all")
              mode = sys.argv[1]
              if mode == "tests":
                  selected = TEST_FILES
              elif mode == "implementation":
                  selected = set(FILES) - TEST_FILES
              elif mode == "all":
                  selected = set(FILES)
              else:
                  raise SystemExit(f"unknown mode: {{mode}}")
              if not REQUIRED_FILES.issubset(FILES):
                  missing = sorted(REQUIRED_FILES - FILES.keys())
                  raise SystemExit(f"Incomplete bootstrap payload: {{missing}}")
              write_files(selected)

          if __name__ == "__main__":
              main()
          '''
          repaired = '\n'.join(line[10:] if line.startswith('          ') else line for line in repaired.splitlines()) + '\n'
          compile(repaired, str(path), 'exec')
          path.write_text(repaired, encoding='utf-8')
          PY

      - name: Prove the new tests fail before implementation
        shell: bash
        run: |
          python scripts/codex_proof_carrying_autofix.py tests
          set +e
          uv run --python 3.12 pytest -q \
            tests/test_edit_safety.py \
            tests/test_proof_carrying_autofix.py \
            > /tmp/autocite-red.log 2>&1
          status=$?
          set -e
          cat /tmp/autocite-red.log
          if [[ "$status" -eq 0 ]]; then
            echo 'Regression tests unexpectedly passed before implementation.' >&2
            exit 1
          fi
          grep -q 'autocite_mcp.edit_safety' /tmp/autocite-red.log

      - name: Apply the proof-carrying implementation
        run: python scripts/codex_proof_carrying_autofix.py implementation

      - name: Run focused proof and regression tests
        run: |
          uv run --python 3.12 pytest -q \
            tests/test_edit_safety.py \
            tests/test_proof_carrying_autofix.py \
            tests/test_engine.py \
            tests/test_tools.py

      - name: Verify the declared Python 3.10 floor
        run: |
          uv sync --frozen --python 3.10 --extra dev --extra tauri-build
          uv run --python 3.10 pytest -q \
            tests/test_edit_safety.py \
            tests/test_proof_carrying_autofix.py \
            tests/test_engine.py \
            tests/test_tools.py

      - name: Run the complete Python quality gate
        run: |
          uv sync --frozen --python 3.12 --extra dev --extra tauri-build
          uv run ruff check src tests training scripts
          uv run pytest
          uv run python -m compileall -q src packaging scripts
          uv run python scripts/eval_gold.py
          uv run python scripts/eval_system.py --fail-under 0.80
          uv build

      - name: Run the complete desktop web quality gate
        run: |
          npm ci --ignore-scripts --prefix desktop
          npm run check --prefix desktop

      - name: Run native shell tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Audit production dependency surfaces
        run: |
          uv audit
          npm run audit:production --prefix desktop

      - name: Commit only the fully verified result
        env:
          BRANCH: codex/proof-carrying-autofix-v071
        run: |
          rm -f scripts/codex_proof_carrying_autofix.py
          rm -f .github/workflows/codex-proof-carrying-autofix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: certify every automatic citation edit'
          git push origin "HEAD:${BRANCH}"
