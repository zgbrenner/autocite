name: Export AutoCite branch for verified editing

on:
  push:
    branches: [codex/proof-carrying-autofix-v071]
    paths:
      - .github/workflows/codex-proof-carrying-autofix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-autocite-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: codex/proof-carrying-autofix-v071

      - name: Package repository source
        run: |
          tar \
            --exclude=.git \
            --exclude=.github/workflows/codex-proof-carrying-autofix.yml \
            --exclude=scripts/codex_proof_carrying_autofix.py \
            -czf /tmp/autocite-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: autocite-source-${{ github.sha }}
          path: /tmp/autocite-source.tgz
          if-no-files-found: error
          retention-days: 1
