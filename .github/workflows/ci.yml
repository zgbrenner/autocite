name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify lockfile and synchronize environment
        run: uv sync --frozen --extra dev
      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check src tests training scripts
      - name: Test
        run: uv run pytest --junitxml=pytest-results.xml
      - name: Compile
        run: uv run python -m compileall -q src/autocite_mcp training scripts
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Package and corpus quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize environment
        run: uv sync --frozen --extra dev
      - name: Evaluate deterministic corpus
        run: uv run autocite eval --file evals/gold.jsonl
      - name: Validate training data pipeline
        run: |
          uv run python training/build_dataset.py --output /tmp/autocite-slm.jsonl
          uv run python training/evaluate_slm.py --safety-file evals/slm_safety.jsonl
      - name: Build distributions
        run: uv build
      - name: Verify distribution boundaries
        run: |
          uv run python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("autocite_mcp/") for name in names)
          assert not any(name.startswith("reference/") for name in names)
          assert not any("The_Bluebook" in name for name in names)
          print(f"verified {wheel}")
          PY
      - name: Upload distributions
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
