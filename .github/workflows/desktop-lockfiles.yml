name: Generate desktop lockfiles

on:
  push:
    branches:
      - codex/phase-2-tauri-word-processor
    paths:
      - desktop/package.json
      - desktop/src-tauri/Cargo.toml
      - .github/workflows/desktop-lockfiles.yml

permissions:
  contents: write

concurrency:
  group: desktop-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/phase-2-tauri-word-processor
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --prefix desktop
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit lockfiles when they changed
        shell: bash
        run: |
          set -euo pipefail
          git add desktop/package-lock.json desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock desktop dependencies"
          git push origin HEAD:codex/phase-2-tauri-word-processor
