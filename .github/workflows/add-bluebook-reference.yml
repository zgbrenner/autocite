name: Add Bluebook reference files

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-reference-files:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check whether import is already complete
        id: check
        run: |
          if [ -f reference/The_Bluebook_Uncovered_22e.pdf ] && [ -f reference/The_Bluebook_Uncovered_22e.md ]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.complete == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download source PDF
        if: steps.check.outputs.complete == 'false'
        run: |
          mkdir -p reference
          curl --fail --location --retry 3 \
            'https://dionneanthon.com/bbu/Anthon%20Bluebook%20Uncovered%20%2822nd%20Edition%20of%20Bluebook%29%202025.08.06.pdf' \
            --output reference/The_Bluebook_Uncovered_22e.pdf

      - name: Install conversion dependencies
        if: steps.check.outputs.complete == 'false'
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.28.0' 'pymupdf4llm==1.28.0'

      - name: Reproduce Markdown conversion
        if: steps.check.outputs.complete == 'false'
        run: python scripts/convert_bluebook_uncovered.py

      - name: Place final files
        if: steps.check.outputs.complete == 'false'
        run: |
          cp reference/generated/The_Bluebook_Uncovered_22e.md reference/The_Bluebook_Uncovered_22e.md
          mkdir -p reference/assets
          cp reference/generated/assets/figure_8_1.png reference/assets/figure_8_1.png
          rm -rf reference/generated reference/generated.zip

      - name: Commit generated reference files
        if: steps.check.outputs.complete == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference
          git commit -m 'Add Bluebook Uncovered PDF and Markdown reference'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
