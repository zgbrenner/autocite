name: Deploy AutoCite site

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Canonical production URL, including trailing slash"
        required: false
        default: "https://zgbrenner-autocite.pages.dev/"

permissions:
  contents: read

concurrency:
  group: autocite-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ "$PUBLIC_SITE_URL" =~ ^https://.+/$ ]] || { echo "site_url must be an HTTPS URL ending in /" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        working-directory: site
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify and build production site
        working-directory: site
        run: |
          npm run lint
          npm test
          npm run build
          npm run audit:seo
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=zgbrenner-autocite --branch=main --commit-dirty=true
