name: Finalize CI repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-ci-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Refresh lockfile and finalize workflow policy
        shell: bash
        run: |
          set -euo pipefail
          uv lock --upgrade-package cryptography
          python - <<'PY'
          from pathlib import Path

          desktop = Path('.github/workflows/desktop.yml')
          text = desktop.read_text(encoding='utf-8')
          if '  pull_request:\n' in text:
              start = text.index('  pull_request:\n')
              end = text.index('  push:\n', start)
              text = text[:start] + text[end:]
          text = text.replace(
              "  cancel-in-progress: ${{ github.event_name == 'pull_request' }}",
              '  cancel-in-progress: false',
          )
          desktop.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8').replace(
              'run: uv sync --extra dev',
              'run: uv sync --frozen --extra dev',
          )
          ci.write_text(ci_text, encoding='utf-8')
          PY
          rm .github/workflows/repair-ci-once.yml
      - name: Commit generated lockfile and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/desktop.yml .github/workflows/ci.yml .github/workflows/repair-ci-once.yml
          git commit -m "ci: finalize deterministic secure pipelines"
          git push origin HEAD:main
