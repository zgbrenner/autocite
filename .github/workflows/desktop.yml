name: Desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Lint desktop and preservation paths
        run: >-
          uv run ruff check
          src/autocite_mcp/desktop.py
          src/autocite_mcp/desktop_entry.py
          src/autocite_mcp/desktop_export.py
          src/autocite_mcp/desktop_preservation.py
          src/autocite_mcp/desktop_review_ui.py
          src/autocite_mcp/docx_preservation.py
          src/autocite_mcp/_docx_preservation_model.py
          src/autocite_mcp/_docx_preservation_package.py
          src/autocite_mcp/_docx_preservation_index.py
          src/autocite_mcp/_docx_preservation_mutation.py
          src/autocite_mcp/real_document_eval.py
          src/autocite_mcp/review_session.py
          src/autocite_mcp/review_view_model.py
          scripts/package_desktop.py
          tests/test_desktop.py
          tests/test_desktop_console.py
          tests/test_desktop_export.py
          tests/test_desktop_preservation.py
          tests/test_desktop_review_ui.py
          tests/test_docx_preservation.py
          tests/test_package_desktop.py
          tests/test_real_document_eval.py
          tests/test_review_session.py
          tests/test_review_view_model.py
          tests/test_release_workflows.py
      - name: Test desktop and preservation paths
        run: >-
          uv run pytest
          tests/test_desktop.py
          tests/test_desktop_console.py
          tests/test_desktop_export.py
          tests/test_desktop_preservation.py
          tests/test_desktop_review_ui.py
          tests/test_docx_preservation.py
          tests/test_package_desktop.py
          tests/test_real_document_eval.py
          tests/test_review_session.py
          tests/test_review_view_model.py
          tests/test_release_workflows.py
      - name: Compile desktop and preservation paths
        run: >-
          uv run python -m compileall -q
          src/autocite_mcp/desktop.py
          src/autocite_mcp/desktop_entry.py
          src/autocite_mcp/desktop_export.py
          src/autocite_mcp/desktop_preservation.py
          src/autocite_mcp/desktop_review_ui.py
          src/autocite_mcp/docx_preservation.py
          src/autocite_mcp/_docx_preservation_model.py
          src/autocite_mcp/_docx_preservation_package.py
          src/autocite_mcp/_docx_preservation_index.py
          src/autocite_mcp/_docx_preservation_mutation.py
          src/autocite_mcp/real_document_eval.py
          src/autocite_mcp/review_session.py
          src/autocite_mcp/review_view_model.py
          scripts/package_desktop.py

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: dist/AutoCite/AutoCite.exe
          - os: macos-15-intel
            platform: macos-x64
            executable: dist/AutoCite/AutoCite
          - os: ubuntu-latest
            platform: linux-x64
            executable: dist/AutoCite/AutoCite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra desktop-build
      - name: Read package version
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: uv run pyinstaller packaging/autocite-desktop.spec --clean --noconfirm
      - name: Run packaged self-tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path "${{ matrix.executable }}").Path
          foreach ($argument in @("--self-test", "--self-test-preservation")) {
            $process = Start-Process -FilePath $executable -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Packaged AutoCite $argument failed with exit code $($process.ExitCode)"
            }
          }
      - name: Run packaged self-tests on Unix
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.executable }} --self-test
          ${{ matrix.executable }} --self-test-preservation
      - name: Package portable archive
        shell: bash
        run: |
          uv run python scripts/package_desktop.py \
            --dist dist/AutoCite \
            --output release \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --start-here packaging/START-HERE.txt \
            --license LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCite-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  build-python:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCite-python
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-desktop, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: AutoCite-*
          path: release
          merge-multiple: true
      - name: Read and validate release version
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Verify release checksums and manifests
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          archives = sorted(Path("release").glob("*.zip"))
          assert len(archives) == 3, f"expected 3 portable archives, found {len(archives)}"
          for archive in archives:
              checksum = archive.with_suffix(archive.suffix + ".sha256")
              manifest = archive.with_name(archive.name.removesuffix(".zip") + ".manifest.json")
              expected = checksum.read_text(encoding="utf-8").split()[0]
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert actual == expected, f"checksum mismatch for {archive.name}"
              metadata = json.loads(manifest.read_text(encoding="utf-8"))
              assert metadata["archive_sha256"] == actual
              assert metadata["portable"] is True
              assert metadata["requires_installer"] is False
              assert metadata["requires_python"] is False
              print(f"verified {archive.name}")
          PY
      - name: Create immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move an immutable release tag." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "AutoCite $VERSION"
          git push origin "$TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* \
            --verify-tag \
            --latest \
            --title "AutoCite $TAG" \
            --notes-file packaging/RELEASE-NOTES.md
