name: Desktop bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src/autocite_mcp/desktop.py scripts/package_desktop.py tests/test_desktop.py tests/test_package_desktop.py
      - run: uv run pytest tests/test_desktop.py tests/test_package_desktop.py

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: dist/AutoCite/AutoCite.exe
          - os: macos-15-intel
            platform: macos-x64
            executable: dist/AutoCite/AutoCite
          - os: ubuntu-latest
            platform: linux-x64
            executable: dist/AutoCite/AutoCite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra desktop-build
      - run: uv run pyinstaller packaging/autocite-desktop.spec --clean --noconfirm
      - name: Run packaged self-test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "${{ matrix.executable }}" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged AutoCite self-test failed with exit code $($process.ExitCode)"
          }
      - name: Run packaged self-test on Unix
        if: runner.os != 'Windows'
        run: ${{ matrix.executable }} --self-test
      - name: Package portable archive
        shell: bash
        run: |
          uv run python scripts/package_desktop.py \
            --dist dist/AutoCite \
            --output release \
            --platform "${{ matrix.platform }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "${GITHUB_SHA}" \
            --start-here packaging/START-HERE.txt \
            --license LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCite-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AutoCite-*
          path: release
          merge-multiple: true
      - name: Verify release checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          archives = sorted(Path("release").glob("*.zip"))
          assert len(archives) == 3, f"expected 3 portable archives, found {len(archives)}"
          for archive in archives:
              checksum = archive.with_suffix(archive.suffix + ".sha256")
              expected = checksum.read_text(encoding="utf-8").split()[0]
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert actual == expected, f"checksum mismatch for {archive.name}"
              print(f"verified {archive.name}")
          PY
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --verify-tag \
              --latest \
              --title "AutoCite $TAG" \
              --notes-file packaging/RELEASE-NOTES.md
          fi
