name: Desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Lint complete repository
        run: uv run ruff check src tests training scripts
      - name: Test complete repository
        run: uv run pytest --junitxml=pytest-results.xml
      - name: Compile complete repository
        run: uv run python -m compileall -q src/autocite_mcp training scripts
      - name: Evaluate deterministic gold corpus
        run: uv run autocite eval --file evals/gold.jsonl
      - name: Evaluate held-out system corpus
        run: uv run autocite eval-system --file evals/system/documents.jsonl --split test --ablations
      - name: Validate training data pipeline
        run: |
          uv run python training/build_dataset.py --output /tmp/autocite-slm.jsonl
          uv run python training/evaluate_slm.py --safety-file evals/slm_safety.jsonl
      - name: Build and inspect Python distributions
        run: |
          uv build
          uv run python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("autocite_mcp/") for name in names)
          assert not any(name.startswith("reference/") for name in names)
          assert not any("The_Bluebook" in name for name in names)
          print(f"verified {wheel}")
          PY
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-verification
          path: pytest-results.xml
          if-no-files-found: warn

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: dist/AutoCite/AutoCite.exe
          - os: macos-15-intel
            platform: macos-x64
            executable: dist/AutoCite/AutoCite
          - os: ubuntu-latest
            platform: linux-x64
            executable: dist/AutoCite/AutoCite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra desktop-build
      - name: Read package version
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: uv run pyinstaller packaging/autocite-desktop.spec --clean --noconfirm
      - name: Run packaged self-tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path "${{ matrix.executable }}").Path
          foreach ($argument in @("--self-test", "--self-test-preservation")) {
            $process = Start-Process -FilePath $executable -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Packaged AutoCite $argument failed with exit code $($process.ExitCode)"
            }
          }
      - name: Run packaged self-tests on Unix
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.executable }} --self-test
          ${{ matrix.executable }} --self-test-preservation
      - name: Package portable archive
        shell: bash
        run: |
          uv run python scripts/package_desktop.py \
            --dist dist/AutoCite \
            --output release \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --start-here packaging/START-HERE.txt \
            --license LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCite-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  build-python:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCite-python
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-desktop, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: AutoCite-*
          path: release
          merge-multiple: true
      - name: Read and validate release version
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Verify release archives, checksums, and manifests
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          device_name = re.compile(
              r"^(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\..*)?$", re.IGNORECASE
          )
          archives = sorted(Path("release").glob("*.zip"))
          assert len(archives) == 3, f"expected 3 portable archives, found {len(archives)}"
          for archive in archives:
              checksum = archive.with_suffix(archive.suffix + ".sha256")
              manifest = archive.with_name(
                  archive.name.removesuffix(".zip") + ".manifest.json"
              )
              assert checksum.is_file(), f"missing checksum for {archive.name}"
              assert manifest.is_file(), f"missing manifest for {archive.name}"
              expected = checksum.read_text(encoding="utf-8").split()[0]
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert actual == expected, f"checksum mismatch for {archive.name}"
              metadata = json.loads(manifest.read_text(encoding="utf-8"))
              assert metadata["archive_sha256"] == actual
              assert metadata["portable"] is True
              assert metadata["requires_installer"] is False
              assert metadata["requires_python"] is False
              assert metadata["version"] == archive.name.rsplit("-v", 1)[1][:-4]

              seen: set[str] = set()
              with zipfile.ZipFile(archive) as bundle:
                  for member in bundle.infolist():
                      raw = member.filename.replace("\\", "/")
                      path = PurePosixPath(raw)
                      assert raw not in seen, f"duplicate archive member: {raw}"
                      seen.add(raw)
                      assert not path.is_absolute(), f"absolute archive path: {raw}"
                      assert ".." not in path.parts, f"archive traversal path: {raw}"
                      assert not raw.startswith(("//", "\\\\")), f"device path: {raw}"
                      assert not any(
                          part.endswith(":") or device_name.match(part.rstrip(". "))
                          for part in path.parts
                      ), f"unsafe Windows archive path: {raw}"
                      mode = (member.external_attr >> 16) & 0o170000
                      assert mode != stat.S_IFLNK, f"symlink archive member: {raw}"
                  required = {
                      "AutoCite/START HERE.txt",
                      "AutoCite/LICENSE.txt",
                      "AutoCite/BUILD-MANIFEST.json",
                  }
                  assert required <= seen, f"missing required files in {archive.name}"
              print(f"verified {archive.name}")
          PY
      - name: Create or verify immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            EXISTING_COMMIT=$(git rev-list -n 1 "$TAG")
            if [[ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to $EXISTING_COMMIT, not $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Verified existing immutable tag $TAG at $GITHUB_SHA."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "AutoCite $VERSION"
            git push origin "$TAG"
          fi
      - name: Create or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" \
              --latest \
              --title "AutoCite $TAG" \
              --notes-file packaging/RELEASE-NOTES.md
          else
            gh release create "$TAG" release/* \
              --verify-tag \
              --latest \
              --title "AutoCite $TAG" \
              --notes-file packaging/RELEASE-NOTES.md
          fi
