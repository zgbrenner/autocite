version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, website]
    commit-message:
      prefix: "build(site-deps)"

  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, desktop]
    commit-message:
      prefix: "build(desktop-deps)"

  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "build(rust-deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "build(actions)"
