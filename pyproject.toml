[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autocite-mcp"
version = "0.1.0"
description = "Conservative Bluepages and Whitepages legal citation checker, fixer, generator, and verifier exposed through MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zachary Brenner" }]
keywords = ["MCP", "legal citation", "Bluebook", "Bluepages", "Whitepages"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "mcp[cli]>=1.28,<2",
  "httpx>=0.27,<1",
  "eyecite>=2.7.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
autocite-mcp = "autocite_mcp.server:main"
autocite = "autocite_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autocite_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
